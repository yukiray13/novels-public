<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Novels</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; }
h1 { text-align: center; }
ul { list-style-type: none; padding: 0; }
li { margin: 10px 0; }
a { text-decoration: none; color: blue; font-size: 1.2em; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>My Novels</h1>
<ul id="novel-list">Loading novels...</ul>

<script>
fetch('novels.json')
.then(res => res.json())
.then(novels => {
    const list = document.getElementById('novel-list');
    list.textContent = '';
    for (const novel of Object.keys(novels)) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `novel.html?name=${encodeURIComponent(novel)}`;
        a.textContent = novel;
        li.appendChild(a);
        list.appendChild(li);
    }
})
.catch(err => {
    document.getElementById('novel-list').textContent = 'Failed to load novels.';
    console.error(err);
});
</script>
</body>
</html>
